[tool.pytest.ini_options]
markers = [
    "live: tests that require PiCar-X hardware (run with sudo, deselect with -m 'not live')",
]
# Bare `pytest` from the repo root must be correct. It was this project's only
# gate until .github/workflows/tests.yml, and it is still the one a developer
# runs first. Without testpaths it collected the .worktrees/ checkouts and died
# with 229 `import file mismatch` errors, because pytest does not honour
# .gitignore (.worktrees/ is ignored at .gitignore:82) and every worktree
# carries a same-named tests/ tree.
testpaths = ["tests"]
norecursedirs = ["picar-x-hacking", ".venv", "node_modules", ".worktrees"]
