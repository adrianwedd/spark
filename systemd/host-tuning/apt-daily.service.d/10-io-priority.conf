# Keep apt off the SD card's critical path (#402).
#
# Measured on `picar` 2026-09-18: `apt-daily` (update) moved 48 MB in a 36 s
# window with the device queue 100 % occupied and io PSI at 93.6 %, and
# `apt-daily-upgrade` (upgrade + clean) reached 70.2 % while moving only 44 KB to
# 1.8 MB — because this SD card's write service time is ~86 ms per write (p90
# 207 ms, #405). Neither job can be rescheduled away from the device, so lower
# its priority rather than its volume.
#
# Install (`systemd/host-tuning` is deliberately *outside* the `*.service`/`*.timer`
# set the deploy gate drifts on — this is a host-tuning file for a non-px unit,
# not a SPARK unit):
#
#   for u in apt-daily apt-daily-upgrade; do
#     sudo install -d "/etc/systemd/system/$u.service.d"
#     sudo install -m 0644 systemd/host-tuning/apt-daily.service.d/10-io-priority.conf \
#       "/etc/systemd/system/$u.service.d/10-io-priority.conf"
#   done
#   sudo systemctl daemon-reload
[Service]
IOSchedulingClass=idle
IOWeight=1
Nice=19
