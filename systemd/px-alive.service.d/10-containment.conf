# Resource containment (#217/#218/#219 follow-up). Measured live
# 2026-08-20T19:33 AEST: cgroup MemoryCurrent ~22-32M — small and stable, not
# a containment target on its own. It is given a memory ceiling anyway
# (consistency: every contained unit gets a finite MemoryMax, not just the
# named outliers) but a generous one, since this daemon holds the Picarx GPIO
# handle and a false-positive throttle/kill here is a real motion-safety
# regression, not a nuisance.
#
# CPUWeight raised from the default (100), not lowered: this is the daemon
# whose own systemd watchdog (WatchdogSec=15) is the thing #217/#205 keep
# tripping under load. Deliberately opposite direction from px-frigate-stream
# — under contention this should win, not yield.
[Service]
MemoryHigh=96M
MemoryMax=192M
OOMPolicy=stop
CPUWeight=200
