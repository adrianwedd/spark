# Resource containment (#217/#218/#219 follow-up). Idle baseline measured
# live 2026-08-20T19:33 AEST: cgroup MemoryCurrent 17M. Max leaves room for an
# active Claude-backed compose pass, which the idle baseline does not
# capture.
#
# CPUWeight lowered from the default (100): scheduled writer, not
# latency-sensitive. Should yield under contention.
[Service]
MemoryHigh=64M
MemoryMax=192M
OOMPolicy=stop
CPUWeight=50
