# Resource containment (#217/#218/#219 follow-up). Kernel memory-cgroup
# accounting and PSI were restored by #218 (cmdline.txt) on 2026-08-20; before
# that, MemoryHigh/MemoryMax below would have parsed and been silently
# unenforceable (MemoryCurrent=[not set]).
#
# Measured live 2026-08-20T19:33 AEST, on a host still running the pre-#242
# two-session architecture (spark-brain + spark-io, restarted at 19:35 into
# the post-#242 single-session code but NOT recycled — KillMode=process keeps
# the existing tmux sessions alive across a supervisor restart by design):
#   cgroup MemoryCurrent: 852M (two resident Claude processes: ~498M + ~421M)
# Once the nightly recycle (02:00 Hobart) rotates spark-io out, steady state
# should be roughly the single ~500-550M session. MemoryHigh is set above the
# CURRENT two-session figure so deployment does not start throttling an
# already-running conversation; MemoryMax leaves ~3x the expected
# single-session steady state for context growth between recycles.
#
# CPUWeight raised from the default (100): #217's strongest evidence is a
# resident brain handshake stalling in the same second as the SDIO -110
# timeout, i.e. this process losing the scheduler under contention. Priority,
# not a hard quota — a quota could itself cause the missed deadline this is
# meant to prevent.
[Service]
MemoryHigh=960M
MemoryMax=1536M
OOMPolicy=stop
CPUWeight=150
