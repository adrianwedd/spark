# Resource containment (#217/#218/#219 follow-up). Idle baseline measured
# live 2026-08-20T19:33 AEST: cgroup MemoryCurrent 15M. Max is set well above
# the idle figure because an active run does real work (git worktree, test
# suite) that the idle baseline does not capture; on-failure restart already
# bounds a wedged run.
#
# CPUWeight lowered from the default (100): on-failure, once/day at most,
# never latency-sensitive. Should yield under contention.
[Service]
MemoryHigh=64M
MemoryMax=192M
OOMPolicy=stop
CPUWeight=50
