# Resource containment (#217/#218/#219 follow-up). Measured live
# 2026-08-20T19:33 AEST: cgroup MemoryCurrent 122M across 41 tasks
# (go2rtc + ffmpeg + rpicam-vid children) — bursty by nature, so headroom is
# wider relative to steady state than for a single-process daemon.
#
# CPUWeight lowered from the default (100): this is a transcoding pipeline,
# not a latency-sensitive one. Under contention it should yield to px-alive
# and px-brain rather than compete with them — the opposite priority
# direction from those two, deliberately.
[Service]
MemoryHigh=224M
MemoryMax=384M
OOMPolicy=stop
CPUWeight=50
