# Resource containment (#217/#218/#219 follow-up). Measured live
# 2026-08-20T19:33 AEST: cgroup MemoryCurrent 52M, RSS 59M. Single task; runs
# a Claude QA gate per candidate post rather than holding a resident model, so
# headroom is sized for that per-call overhead rather than a growing baseline.
[Service]
MemoryHigh=128M
MemoryMax=256M
OOMPolicy=stop
