# Resource containment (#217/#218/#219 follow-up). Characterized in #246
# (2026-08-20T21:30 AEST): the service loads ~228MB of TorchScript model
# weights (glados-new.pt 111MB + vocoder-gpu.pt 54MB + phonemizer 63MB) into
# anonymous memory via torch.jit.load, plus ~280MB of torch runtime .so
# files. Referenced memory is only 21MB of 463MB RSS — 95% is cold but
# unreclaimable (anonymous pages). 0 synthesize calls in 7 days.
#
# Measured: RSS 463M   PSS 452M   Anonymous 433M
# Peak:     VmHWM 647M   cgroup MemoryPeak 879M (model load + 2 warmup inferences)
#
# MemoryHigh sits above the 475M steady-state cgroup current. MemoryMax
# was 768M — below the 879M recorded cgroup peak — and has been raised to
# 896M so a restart's warmup phase (model load + 2 init inferences) does
# not get OOM-killed before settling to steady state. The warmup peak is
# transient: the two `init` calls in `tts_runner.__init__` allocate
# inference buffers that are freed after construction.
[Service]
MemoryHigh=576M
MemoryMax=896M
OOMPolicy=stop
