# Resource containment (#217/#218/#219 follow-up). Not previously
# characterized by any issue, but the 2026-08-20T19:33 AEST resource-envelope
# assay found it comparable in size to the #219 px-wake-listen outlier:
#   cgroup MemoryCurrent: 501M   RSS: 485M   PSS: 474M (mostly anonymous)
# No documented peak equivalent to #219's 900M exists for this service, so
# these limits are deliberately more conservative (smaller multiple over
# observed steady state) than px-wake-listen's rather than assuming similar
# headroom is safe. Recommended follow-up: a #219-style characterization of
# what backs this ~450M+ anonymous footprint (GLaDOS TTS model weights?).
[Service]
MemoryHigh=576M
MemoryMax=768M
OOMPolicy=stop
