# Resource containment (#217/#218/#219 follow-up). #219 found this service the
# largest non-Claude memory consumer: ~555M RSS steady state (a single
# unreclaimable ~446M anonymous heap, byte-identical across 73 samples — a
# static allocation, not a leak) with a 900M VmHWM peak observed once this
# boot, attributed to two ASR backends (vosk wake-word + a transcription
# model) resident at once.
#
# Re-measured live 2026-08-20T19:33 AEST, after #242/M5 routing changes:
#   cgroup MemoryCurrent: 522M   RSS: 571M   PSS: 561M
# Essentially unchanged from #219's baseline — still the named outlier.
#
# MemoryHigh sits just above the observed steady state (throttles abnormal
# growth without touching normal operation). MemoryMax sits above the
# documented 900M peak with ~12% margin, so a legitimate backend-swap does not
# get OOM-killed, while a runaway beyond that is contained to this cgroup
# instead of competing with px-brain for the host's last ~900M.
[Service]
MemoryHigh=640M
MemoryMax=1024M
OOMPolicy=stop
