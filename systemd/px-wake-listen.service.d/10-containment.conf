# Resource containment (#217/#218/#219 follow-up).
#
# 2026-08-23 recalibration, from measured POST-FIX evidence, not a round-
# number bump. The original 640M/1024M pair (below) predated the discovery
# that this service's memory growth was a fixable glibc allocator-retention
# defect, not an intrinsic cost — every real cycle left arena memory behind
# that neither `del` nor `gc.collect()` on Python-level references could
# reach, so RSS ratcheted upward across hours of operation toward the 900M+
# peak this drop-in used to be sized against. bin/px-wake-listen now calls
# `_release_transient_memory()` (gc.collect() + malloc_trim(0)) after every
# completed transcription, without unloading the resident models.
#
# bin/px-wake-memprofile (repeated-cycle mode, PX_MEMPROFILE_CYCLES=8), run
# live twice on 2026-08-23 with the service stopped:
#   after both models load, before any inference:  707-718M PSS  (RSS 718-730M)
#   after one UNTRIMMED inference:                 719M PSS      (+~12M — the
#     transient inference cost itself is small; the model load is the peak)
#   after the FIRST malloc_trim(0) call:            449M PSS      (RSS 460M)
#   after 7 further inference+trim cycles:          449M PSS, byte-flat RSS
#     (460M exactly, zero drift) — the fix eliminates the accumulation.
#
# The two model-load runs landed at 707M and 718M PSS respectively (host
# memory state varies the allocator's initial layout) — both well above the
# old 640M MemoryHigh, which is *why* this service was chronically throttled
# even before any leak: the ceiling was already below the legitimate one-time
# load peak. Trimming cannot lower that peak (it happens before the first
# trim call ever runs, once per process lifetime); only the fix's REPEATED-
# cycle result (flat 449-460M) speaks to genuine steady-state margin.
#
# MemoryHigh=896M clears the measured 707-730M load-time peak with ~25-27%
# headroom, so the throttle does not fire on ordinary startup — the failure
# mode this drop-in previously guaranteed on every boot. MemoryMax=1280M
# keeps ~43% margin above MemoryHigh and stays comfortably above the
# historical 900-924M VmHWM peak (#219's original, pre-fix worst case, back
# when nothing ever trimmed the arena) as a backstop for genuine anomalies —
# a slow/contended model load, a fallback backend briefly resident alongside
# SenseVoice, or aplay/sudo child processes sharing this cgroup during a
# voice turn — without being sized to *expect* that peak as routine, the way
# the pre-fix limits were.
[Service]
MemoryHigh=896M
MemoryMax=1280M
OOMPolicy=stop
