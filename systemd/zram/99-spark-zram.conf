# sysctl tuning that pairs with zram swap (issue #283).
# Install target: /etc/sysctl.d/99-spark-zram.conf
#
# page-cluster=0: zram has no seek cost, so readahead of 8 pages per
# fault (the default, 2^3) only adds decompression latency.
# swappiness=100: with swap on compressed RAM, reclaiming anon pages is
# no longer orders of magnitude slower than dropping page cache; the
# default 60 was calibrated for disk swap. 100 (not the max 200) keeps
# the change conservative while the SD swapfile is still a fallback tier.
vm.page-cluster = 0
vm.swappiness = 100
