# systemd-zram-generator config for SPARK (issue #283 / #247).
# Install target: /etc/systemd/zram-generator.conf
#
# Why: 110 instrumented arecord overruns correlate with IO PSI (median
# psi_io_some_avg10 = 91.6% at overrun) and with SD-swap exhaustion
# (median swap_free_kb at overrun = 10212 of 524284). Swapping to
# compressed RAM instead of mmcblk0 breaks the memory-pressure ->
# SD-swap -> IO-stall -> lost-audio loop.
#
# Sizing: 1024 MB uncompressed capacity on a 3.7 GiB Pi. With zstd
# (~3:1 on typical anon pages) worst-case resident cost is ~350 MB,
# only when the device is actually full. Conservative by design.
#
# Priority 100 beats the dphys-swapfile at /var/swap (priority -2),
# which stays enabled as overflow/fallback — do not disable it yet.

[zram0]
zram-size = 1024
compression-algorithm = zstd
swap-priority = 100
